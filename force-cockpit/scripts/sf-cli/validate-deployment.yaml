name: 🧪 Validate Deployment (Dry Run)
description: >-
  Validates a metadata deployment against the connected org without saving
  it — a safe dry run before the real deploy. Always runs Apex tests.
inputs:
  - name: sourceDir
    label: Source directory to validate (e.g. force-app)
    required: true
  - name: testLevel
    label: Test level
    type: picklist
    required: true
    options:
      - RunLocalTests
      - RunAllTestsInOrg
      - RunSpecifiedTests
      - RunRelevantTests
command: sf project deploy validate --target-org "${orgUsername}" --source-dir "${sourceDir}" --test-level ${testLevel}

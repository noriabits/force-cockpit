<section class="card" id="query-card">
  <div class="query-editor">
    <div class="query-tab-bar" id="query-tab-bar"></div>
    <div class="query-editor-body">
      <div class="query-editor-main">
        <!-- The <pre> renders the tokenized query underneath a transparent
             textarea; both layers share one CSS metrics rule so they align. -->
        <div class="soql-editor-stack" id="soql-editor-stack">
          <pre class="soql-highlight" id="soql-highlight" aria-hidden="true"></pre>
          <textarea
            id="soql-input"
            class="soql-textarea"
            spellcheck="false"
            placeholder="SELECT Id, Name FROM Account LIMIT 10"
            rows="4"
          ></textarea>
        </div>
        <div class="query-autocomplete" id="query-autocomplete" style="display: none"></div>
        <div class="query-toolbar">
          <!-- The ✕ Cancel button next to Run is injected/removed in JS while a
               query is in flight (view/index.js), the same visual pattern
               action-tracker.js uses elsewhere in the app. -->
          <button class="btn btn-primary" id="btn-run-query">Run Query</button>
          <button class="btn btn-ghost" id="btn-clear-query">Clear</button>
          <label
            class="query-tooling-toggle"
            data-tooltip="Run against the Tooling API"
            aria-label="Run against the Tooling API"
          >
            <input type="checkbox" id="query-use-tooling" />
            Tooling API
          </label>
          <div class="query-history-wrap">
            <button class="btn btn-ghost" id="btn-query-history">History ▾</button>
            <!--
              The shared history dropdown's mount CONTAINER. Three things here
              are load-bearing: it must stay EMPTY (Preact's first render
              appends, so a placeholder would sit above the panel), it must keep
              its id (view/index.js resolves it by id), and it must keep
              `display: none` — redundant on every toggle once the bundle has
              run, but the only thing preventing a flash of an empty bordered
              box between HTML parse and the deferred bundle's first effect.
            -->
            <div
              class="query-history-dropdown"
              id="query-history-dropdown"
              style="display: none"
            ></div>
          </div>
          <button
            class="btn btn-ghost"
            id="btn-save-query"
            data-tooltip="Save current query"
            aria-label="Save current query"
          >
            ★ Save
          </button>
          <button
            class="btn btn-ghost"
            id="btn-clone-query"
            data-tooltip="Clone the current tab into a new tab"
            aria-label="Clone the current tab into a new tab"
          >
            ⧉ Clone
          </button>
          <button
            class="btn btn-ghost"
            id="btn-soql-ai"
            data-tooltip="Describe the records you want and let AI write the query"
            aria-label="Describe the records you want and let AI write the query"
          >
            ✨ Ask AI
          </button>
          <button
            class="btn btn-ghost"
            id="btn-soql-fields"
            data-tooltip="Browse this object's fields"
            aria-label="Browse this object's fields"
          >
            🗂 Fields
          </button>
          <span class="query-hint" id="query-hint"></span>
        </div>
      </div>

      <!-- Field browser. Hidden until the 🗂 button reveals it — a persistent,
           resizable column beside the editor (not a hide-on-blur dropdown like
           History, and not below-the-fold like the AI panel), because "what
           fields does this object even have" wants to stay open while typing. -->
      <aside class="query-fields-panel" id="query-fields-panel" style="display: none">
        <div class="query-fields-header">
          <button
            type="button"
            class="btn btn-ghost query-fields-object-btn"
            id="query-fields-object-btn"
          ></button>
          <button
            type="button"
            class="query-fields-close"
            id="query-fields-close"
            aria-label="Close fields panel"
          >
            ✕
          </button>
        </div>
        <input
          type="text"
          id="query-fields-search"
          class="text-input query-fields-search"
          placeholder="Search…"
          spellcheck="false"
        />
        <div class="query-fields-list" id="query-fields-list"></div>
        <div class="query-fields-status" id="query-fields-status"></div>
      </aside>
    </div>
  </div>

  <!-- AI query generator. Hidden until the ✨ button reveals it, so the tab
       looks exactly as it did for anyone not using it. -->
  <div class="soql-ai" id="soql-ai" style="display: none">
    <div class="soql-ai-toolbar">
      <select class="text-input soql-ai-select" id="soql-ai-model"></select>
      <span class="query-toolbar-spacer"></span>
      <button type="button" class="btn btn-ghost" id="soql-ai-new">New chat</button>
    </div>

    <pre class="soql-ai-output" id="soql-ai-output"></pre>

    <div class="soql-ai-proposal" id="soql-ai-proposal" style="display: none">
      <span class="soql-ai-proposal-title" id="soql-ai-proposal-title">Proposed query</span>
      <pre class="soql-ai-query" id="soql-ai-query"></pre>
      <div class="soql-ai-note" id="soql-ai-tooling-note" style="display: none"></div>
      <div class="feature-actions">
        <button type="button" class="btn btn-primary" id="soql-ai-run">▶ Run in new tab</button>
        <button type="button" class="btn btn-ghost" id="soql-ai-copy">Copy</button>
      </div>
    </div>

    <div class="soql-ai-composer">
      <textarea
        class="text-input"
        id="soql-ai-question"
        rows="2"
        spellcheck="false"
        placeholder="Describe the records you want…"
      ></textarea>
      <button type="button" class="btn btn-primary" id="soql-ai-send">Ask</button>
    </div>
  </div>

  <!-- Results -->
  <div id="query-results" style="display: none">
    <div class="query-results-toolbar">
      <input
        type="text"
        id="query-filter-input"
        class="query-filter-input"
        placeholder="Filter results…"
        spellcheck="false"
      />
      <span class="query-match-count" id="query-match-count"></span>
      <span class="results-meta" id="results-meta"></span>
      <span class="query-toolbar-spacer"></span>
      <button class="btn btn-ghost" id="btn-export-csv">Export CSV</button>
      <button class="btn btn-ghost" id="btn-export-json">Export JSON</button>
    </div>
    <div class="table-wrapper">
      <table class="results-table" id="results-table">
        <thead id="results-thead"></thead>
        <tbody id="results-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="query-error" class="error-box" style="display: none"></div>
</section>
